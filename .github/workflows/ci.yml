name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: andromeda-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#andromeda -L

      - name: Smoke test
        run: |
          ./result/bin/andromeda --version
          ./result/bin/andromeda run tests/smoke.ts

      - run: nix build .#andromeda-headless -L -o result-headless

      - name: Smoke test (headless)
        run: |
          ./result-headless/bin/andromeda --version
          ./result-headless/bin/andromeda run tests/smoke.ts
